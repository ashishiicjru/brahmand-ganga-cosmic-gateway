function drift(p,dt,t,vy,vx,lim){const a=p.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){const k=i/3;a[i+1]+=(typeof vy=='function'?vy(k):vy)*dt;a[i]+=(vx+Math.sin(t*.4+k)*.12)*dt;if(a[i+1]>8.5)a[i+1]=-8.5;if(a[i+1]<-8.5)a[i+1]=8.5;if(a[i]<-14)a[i]=14}p.geometry.attributes.position.needsUpdate=true}
/* ---------- tour ---------- */
let cur=null,old=null,idx=-1,auto=!matchMedia('(prefers-reduced-motion:reduce)').matches,tm=0,dwell=0,DT=0,dv=0,TL=1,Lv=1;const TA=new C(),TB=new C(),DWELL=12,N=SP.length;
const vis=()=>{const h=2*Math.tan(T.MathUtils.degToRad(cam.fov/2))*14;return[h,h*cam.aspect]};
function fit(c){if(!c)return;const[h,w]=vis(),m=innerWidth<700;c.w.scale.setScalar(Math.min(w*(m?.88:.62)/c.sz.x,h*(m?.32:.5)/c.sz.y))}
function spawn(i){const s=SP[i],ex=s.b(),[grp,ms]=mk(ex.Q,M),w=new T.Group();w.add(grp);const box=new T.Box3().setFromObject(grp),ctr=box.getCenter(new V3());grp.position.sub(ctr);
const c={w,grp,ms,s,i,sz:box.getSize(new V3()),born:tm,out:0,lure:ex.lure&&new V3(...ex.lure).sub(ctr)};sc.add(w);fit(c);return c}
function kill(c){sc.remove(c.w);c.ms.forEach(m=>m.geometry.dispose())}
function def(c,t){const s=c.s,k=s.k,L=s.L;c.ms.forEach(m=>{const b=m.geometry.userData.b,p=m.geometry.attributes.position.array;
for(let i=0;i<p.length;i+=3){const x=b[i],y=b[i+1],z=b[i+2];let X=x,Y=y,Z=z;
if(k=='h'||k=='v'){const u=Math.max(0,(L/2-x)/L-.3)/.7,o=s.A*L*u*u*Math.sin(t-u*4);k=='h'?Z+=o:Y+=o}
else if(k=='r'){const w=Math.abs(z);Y+=s.A*w*w*Math.sin(t-w*.9)}
else{const r=y>-.02?1+.1*Math.sin(t):1;X=x*r+(y<0?Math.sin(t*.6+y*3)*.07*-y:0);Z=z*r;Y=y>0?y*(1-.1*Math.sin(t)):y}
p[i]=X;p[i+1]=Y;p[i+2]=Z}m.geometry.attributes.position.needsUpdate=true})}
function place(c){const[h,w]=vis(),m=innerWidth<700,sw=Math.sin(tm*.3)*w*.035;let x=sw,sp=1;
if(!c.out){const q=1-Math.pow(1-Math.min(1,(tm-c.born)/3.4),3);x=sw-(1-q)*w*.85;sp=1+(1-q)*2}else{const e=(tm-c.out)/2.4;x=sw+e*e*w*1.2;sp=1+e*2.5}
const y=h*(m?.17:.07)+Math.sin(tm*.5+c.i)*h*.015+(c.s.k=='j'?Math.sin(tm*3.2)*h*.012:0);
c.w.position.set(x,y,0);c.w.rotation.set(0,Math.sin(tm*.27)*.35,Math.sin(tm*.4)*.04+(c.s.k=='j'?0:Math.sin(tm*.31)*.03));def(c,tm*c.s.f_*sp)}
function go(i){i=(i+N)%N;if(i==idx)return;if(old)kill(old);if(cur){cur.out=tm;old=cur}idx=i;cur=spawn(i);dwell=0;ui(i)}
const inf=$('info');
function ui(i){const s=SP[i];inf.classList.remove('in');clearTimeout(ui.t);ui.t=setTimeout(()=>{$('nm').textContent=s.n;$('la').textContent=s.la;$('ft').textContent=s.f;
$('st').innerHTML=[['Size',s.sz],['Lives at',s.r],['Eats',s.e]].map(a=>`<div><dt>${a[0]}</dt><dd>${a[1]}</dd></div>`).join('');inf.classList.add('in')},inf.dataset.s?450:0);inf.dataset.s=1;
$('pos').textContent='Stop '+(i+1)+' of '+N+', shallow to deep';DT=s.d;TA.set(s.top);TB.set(s.bot);TL=s.li;[...$('rl').children].forEach((b,j)=>b.classList.toggle('on',j==i))}
SP.forEach((s,i)=>{const b=document.createElement('button');b.style.top=(i/(N-1)*100)+'%';b.innerHTML='<span>'+s.n+'</span><i></i>';b.setAttribute('aria-label',s.n);b.onclick=()=>go(i);$('rl').appendChild(b)});
$('pv').onclick=()=>go(idx-1);$('nx').onclick=()=>go(idx+1);
const pl=$('pl');pl.onclick=()=>{auto=!auto;pl.textContent=auto?'Pause':'Play'};pl.textContent=auto?'Pause':'Play';
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(idx+1);if(e.key=='ArrowLeft')go(idx-1);if(e.key==' '){e.preventDefault();pl.onclick()}});
let sx=0;cv.addEventListener('pointerdown',e=>sx=e.clientX);cv.addEventListener('pointerup',e=>{const d=e.clientX-sx;if(Math.abs(d)>60)go(idx+(d<0?1:-1))});
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();U.asp.value=cam.aspect;fit(cur);fit(old)}addEventListener('resize',size);size();
const clk=new T.Clock(),pg=$('pg'),tv=new V3();
function loop(){const dt=Math.min(clk.getDelta(),.05);tm+=dt;const k=1-Math.exp(-dt*2);
U.t.value=tm;U.a.value.lerp(TA,k);U.b.value.lerp(TB,k);Lv+=(TL-Lv)*k;U.L.value=Lv;
hemi.color.copy(U.a.value).lerp(new C(0xffffff),.25);hemi.groundColor.copy(U.b.value);hemi.intensity=.45+.8*Lv;sun.intensity=.1+2.5*Lv;fill.intensity=.3+.5*(1-Lv);rim.intensity=1.5+2.5*(1-Lv);
snow.material.color.setRGB(1,1,1).lerp(new C(0x5fffe0),1-Lv);snow.material.opacity=.35+.4*(1-Lv);bub.material.opacity=.7*Lv;
drift(snow,dt,tm,-.18,-.4);drift(bub,dt,tm,k=>.7+(k%5)*.18,-.1);
if(auto)dwell+=dt;if(dwell>DWELL)go(idx+1);pg.style.transform='scaleX('+Math.min(1,dwell/DWELL)+')';
dv+=(DT-dv)*k*1.2;$('dv').textContent=Math.round(dv).toLocaleString()+' m';$('pr').textContent=(1+dv/10).toFixed(dv<100?1:0)+' atm of pressure';
place(cur);if(old){place(old);if(tm-old.out>2.5){kill(old);old=null}}
if(cur.lure){cur.w.updateMatrixWorld(true);tv.copy(cur.lure).applyMatrix4(cur.grp.matrixWorld);lure.position.copy(tv);lure.intensity=6}else lure.intensity=0;
cam.position.set(Math.sin(tm*.15)*.3,Math.cos(tm*.12)*.18,14);cam.lookAt(0,0,0);
R.render(sc,cam);requestAnimationFrame(loop)}
go(0);loop();
</script></body></html>
